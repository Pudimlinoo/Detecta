<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HandCam</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: black;
      transform-origin: top left;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .block {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-weight: bold;
      color: white;
      user-select: none;
      cursor: grab;
      z-index: 3;
      font-size: 18px;
      transform-origin: center center;
      will-change: transform, left, top, width, height;

      /* sombra */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);

      /* textura */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* deixa bonito em qualquer textura */
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .block::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.05));
      pointer-events: none;
    }

    .block span {
      position: relative;
      z-index: 2;
      padding: 10px 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      opacity: 0.95;
    }

    .block.grabbed {
      cursor: grabbing;
      box-shadow: 0 18px 45px rgba(0, 255, 170, 0.35);
      border-color: rgba(0,255,170,0.35);
    }

    #hud {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 9999;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      color: white;
      font-size: 13px;
      line-height: 1.35;
      width: 520px;
      user-select: none;
      pointer-events: none;
    }

    #hud b { color: #00ff99; }
    #hud .small { opacity: 0.85; font-size: 12px; }
    #hud .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      margin: 4px 4px 0 0;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="hud">
    <div><b>HandCam</b> <span class="small"></span></div>
    <div class="small" style="margin-top:6px;">
      <span class="pill">1 dedo = desenhar</span>
      <span class="pill">2 dedos = borracha</span>
      <span class="pill">pinch 1 mão = mover</span>
      <span class="pill">pinch 2 mãos = esticar livre</span>
      <span class="pill">3 dedos = toggle giro</span>
      <span class="pill">giro ON = rotaciona (não estica)</span>
    </div>
    <div class="small" style="margin-top:8px;">
      Estado: <b id="modeState">...</b>
    </div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <canvas id="draw"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ===================== FIXED 1080p STAGE ===================== */
const STAGE_W = 1920;
const STAGE_H = 1080;

const stage = document.getElementById("stage");
function fitStage() {
  const sx = window.innerWidth / STAGE_W;
  const sy = window.innerHeight / STAGE_H;
  const s = Math.min(sx, sy);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitStage);
fitStage();

/* ===================== CANVAS SETUP ===================== */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const drawCanvas = document.getElementById("draw");
const drawCtx = drawCanvas.getContext("2d");

canvas.width = STAGE_W;
canvas.height = STAGE_H;
drawCanvas.width = STAGE_W;
drawCanvas.height = STAGE_H;

video.style.zIndex = 0;
canvas.style.zIndex = 1;
drawCanvas.style.zIndex = 2;

/* desenho */
drawCtx.strokeStyle = "#FFFF00";
drawCtx.lineWidth = 7;
drawCtx.lineCap = "round";
drawCtx.lineJoin = "round";
drawCtx.globalCompositeOperation = "source-over";

/* ===================== HUD ===================== */
const modeStateEl = document.getElementById("modeState");

/* ===================== CONFIG ===================== */
const CFG = {
  fingerSmooth: 0.38,
  rotSmooth: 0.22,      // um pouco mais suave
  sizeSmooth: 0.28,
  pinchDist: 0.060,
  minSize: 70,
  maxSize: 1200,

  eraseRadius: 55,
  drawMinMove: 2.2,
};

let rotateEnabled = true;
let lastRotateToggleTime = 0;
const ROTATE_TOGGLE_COOLDOWN = 800;

/* ===================== HELPERS ===================== */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }

function smoothPoint(prev, next, t) {
  if (!prev) return { x: next.x, y: next.y };
  return { x: lerp(prev.x, next.x, t), y: lerp(prev.y, next.y, t) };
}

function isFingerExtended(lm, tipIdx, pipIdx, margin=0.02) {
  return lm[tipIdx].y < lm[pipIdx].y - margin;
}

// normaliza delta de ângulo pra nunca dar "pulo" (giro 360 contínuo)
function normalizeAngleDelta(d) {
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/* ===================== HAND STATE ===================== */

const HandPersistent = {};

/* ===================== BLOCO SYSTEM ===================== */

function createBlock(text, x, y, textureUrl) {
  const el = document.createElement("div");
  el.className = "block";
  el.style.left = x + "px";
  el.style.top = y + "px";

  el.dataset.rot = "0";

  // textura
  el.style.backgroundImage = `url('${textureUrl}')`;

  const label = document.createElement("span");
  label.textContent = text;
  el.appendChild(label);

  stage.appendChild(el);

  Blocks.push({
    el,
    grabbedBy: [],
    last2Hand: null,

    // rotação 360 contínua:
    lastAng: null,       // ângulo anterior entre as mãos
    rotAccumDeg: 0,      // rotação acumulada em graus
  });
}

function handOverBlock(hand, block) {
  const x = hand.tip.x;
  const y = hand.tip.y;

  const left = block.el.offsetLeft;
  const top = block.el.offsetTop;
  const right = left + block.el.offsetWidth;
  const bottom = top + block.el.offsetHeight;

  return x > left && x < right && y > top && y < bottom;
}

/* ===================== GESTURES ===================== */
function pinch(hand) {
  const lm = hand.landmarks;
  if (!lm) return false;
  const thumb = lm[4];
  const index = lm[8];
  const d = Math.hypot(thumb.x - index.x, thumb.y - index.y);
  return d < CFG.pinchDist;
}

function isOneFingerDraw(hand) {
  const lm = hand.landmarks;
  if (!lm) return false;

  const indexUp = isFingerExtended(lm, 8, 6, 0.015);
  const middleUp = isFingerExtended(lm, 12, 10, 0.015);
  const ringUp = isFingerExtended(lm, 16, 14, 0.015);
  const pinkyUp = isFingerExtended(lm, 20, 18, 0.015);

  return indexUp && !middleUp && !ringUp && !pinkyUp;
}

function isTwoFingerErase(hand) {
  const lm = hand.landmarks;
  if (!lm) return false;

  const indexUp = isFingerExtended(lm, 8, 6, 0.015);
  const middleUp = isFingerExtended(lm, 12, 10, 0.015);
  const ringUp = isFingerExtended(lm, 16, 14, 0.015);
  const pinkyUp = isFingerExtended(lm, 20, 18, 0.015);

  return indexUp && middleUp && !ringUp && !pinkyUp;
}

function isThreeFingerToggleRotate(hand) {
  const lm = hand.landmarks;
  if (!lm) return false;

  const indexUp  = isFingerExtended(lm, 8, 6, 0.015);
  const middleUp = isFingerExtended(lm, 12, 10, 0.015);
  const ringUp   = isFingerExtended(lm, 16, 14, 0.015);
  const pinkyUp  = isFingerExtended(lm, 20, 18, 0.015);

  return indexUp && middleUp && ringUp && !pinkyUp;
}

/* ===================== DRAW / ERASE ===================== */
function drawLineSmooth(hand, hp) {
  const p = hand.tip;

  if (!hp.lastDraw) {
    hp.lastDraw = { x: p.x, y: p.y };
    drawCtx.beginPath();
    drawCtx.moveTo(p.x, p.y);
    return;
  }

  const d = Math.hypot(p.x - hp.lastDraw.x, p.y - hp.lastDraw.y);
  if (d < CFG.drawMinMove) return;

  drawCtx.lineTo(p.x, p.y);
  drawCtx.stroke();
  hp.lastDraw = { x: p.x, y: p.y };
}

function eraseAtPoint(p) {
  drawCtx.save();
  drawCtx.globalCompositeOperation = "destination-out";
  drawCtx.beginPath();
  drawCtx.arc(p.x, p.y, CFG.eraseRadius, 0, Math.PI * 2);
  drawCtx.fill();
  drawCtx.restore();
}

/* ===================== UPDATE BLOCKS ===================== */
function updateBlocks() {
  if (Hands_State.length === 0) return;

  // 1) pegar/mover com 1 mão
  for (const hand of Hands_State) {
    const label = hand.label;
    const isPinching = pinch(hand);

    const hp = HandPersistent[label] || { smTip: null, lastDraw: null };
    HandPersistent[label] = hp;

    hp.smTip = smoothPoint(hp.smTip, hand.tip, CFG.fingerSmooth);
    hand.tip = hp.smTip;

    let myBlock = Blocks.find(b => b.grabbedBy.includes(label)) || null;

    // pegar bloco
    if (isPinching && !myBlock) {
      for (const block of Blocks) {
        if (handOverBlock(hand, block) && block.grabbedBy.length < 2) {
          block.grabbedBy.push(label);
          block.el.classList.add("grabbed");
          block.el.style.zIndex = 1000;
          myBlock = block;
          break;
        }
      }
    }

    // mover (1 mão)
    if (myBlock && isPinching && myBlock.grabbedBy.length === 1) {
      const bw = myBlock.el.offsetWidth;
      const bh = myBlock.el.offsetHeight;

      const nx = clamp(hand.tip.x - bw / 2, 0, STAGE_W - bw);
      const ny = clamp(hand.tip.y - bh / 2, 0, STAGE_H - bh);

      myBlock.el.style.left = nx + "px";
      myBlock.el.style.top = ny + "px";
    }

    // soltar
    if (!isPinching) {
      const owned = Blocks.find(b => b.grabbedBy.includes(label));
      if (owned) {
        const idx = owned.grabbedBy.indexOf(label);
        if (idx !== -1) owned.grabbedBy.splice(idx, 1);

        if (owned.grabbedBy.length === 0) {
          owned.el.classList.remove("grabbed");
          owned.el.style.zIndex = 3;

          owned.last2Hand = null;
          owned.lastAng = null; // reseta rotação contínua
        }
      }
    }
  }

  // 2) 2 mãos: ou ESTICA (giro OFF) ou ROTACIONA (giro ON)
  for (const block of Blocks) {
    if (block.grabbedBy.length !== 2) continue;

    const aLabel = block.grabbedBy[0];
    const bLabel = block.grabbedBy[1];

    const handA = Hands_State.find(h => h.label === aLabel);
    const handB = Hands_State.find(h => h.label === bLabel);
    if (!handA || !handB) continue;

    const pinA = pinch(handA);
    const pinB = pinch(handB);
    if (!pinA || !pinB) continue;

    const p1 = handA.tip;
    const p2 = handB.tip;

    const curLeft = block.el.offsetLeft;
    const curTop = block.el.offsetTop;
    const curW = block.el.offsetWidth;
    const curH = block.el.offsetHeight;

    // ====== MODO ESTICAR (giro OFF) ======
    if (!rotateEnabled) {
      let left = Math.min(p1.x, p2.x);
      let top = Math.min(p1.y, p2.y);
      let w = Math.abs(p2.x - p1.x);
      let h = Math.abs(p2.y - p1.y);

      w = clamp(w, CFG.minSize, CFG.maxSize);
      h = clamp(h, CFG.minSize, CFG.maxSize);

      left = clamp(left, 0, STAGE_W - w);
      top = clamp(top, 0, STAGE_H - h);

      const smLeft = lerp(curLeft, left, CFG.sizeSmooth);
      const smTop  = lerp(curTop, top, CFG.sizeSmooth);
      const smW    = lerp(curW, w, CFG.sizeSmooth);
      const smH    = lerp(curH, h, CFG.sizeSmooth);

      block.el.style.left = smLeft + "px";
      block.el.style.top = smTop + "px";
      block.el.style.width = smW + "px";
      block.el.style.height = smH + "px";

      // não rotaciona enquanto giro OFF
      block.lastAng = null;
      const curRot = block.rotAccumDeg;
      block.el.style.transform = `rotate(${curRot}deg)`;
    }

    // ====== MODO GIRO (giro ON) ======
    if (rotateEnabled) {
      // quando giro ON: NÃO estica, só centraliza + rotaciona 360 contínuo
      const cx = (p1.x + p2.x) / 2;
      const cy = (p1.y + p2.y) / 2;

      const bw = block.el.offsetWidth;
      const bh = block.el.offsetHeight;

      block.el.style.left = clamp(cx - bw / 2, 0, STAGE_W - bw) + "px";
      block.el.style.top  = clamp(cy - bh / 2, 0, STAGE_H - bh) + "px";

      const nowAng = angle(p1, p2);

      if (block.lastAng === null) {
        block.lastAng = nowAng;
      } else {
        let d = nowAng - block.lastAng;
        d = normalizeAngleDelta(d); // aqui é o segredo do giro 360 certinho

        const deltaDeg = d * 180 / Math.PI;
        block.rotAccumDeg += deltaDeg;
        block.lastAng = nowAng;
      }

      // suaviza visualmente (sem perder o 360)
      const curVisualRot = parseFloat(block.el.dataset.rot || "0");
      const targetRot = block.rotAccumDeg;
      const smRot = lerp(curVisualRot, targetRot, CFG.rotSmooth);

      block.el.dataset.rot = String(smRot);
      block.el.style.transform = `rotate(${smRot}deg)`;
    }
  }
}

/* ===================== MEDIAPIPE ===================== */
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.78,
  minTrackingConfidence: 0.78
});

hands.onResults(results => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.image) {
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }

  Hands_State = [];

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
      const landmarks = results.multiHandLandmarks[i];
      const handedness = results.multiHandedness && results.multiHandedness[i];
      const handLabel = handedness?.classification?.[0]?.label || (i === 0 ? "Left" : "Right");

      const tip = {
        x: (1 - landmarks[8].x) * STAGE_W,
        y: landmarks[8].y * STAGE_H
      };

      Hands_State.push({ label: handLabel, landmarks, tip });

      const mirrored = landmarks.map(l => ({ x: 1 - l.x, y: l.y }));
      drawConnectors(ctx, mirrored, HAND_CONNECTIONS, { color: "#00FF00" });
      drawLandmarks(ctx, mirrored, { color: "#FF0000", radius: 4 });
    }
  }

  // ======== TOGGLE GIRO (3 dedos) =========
  const now = Date.now();
  for (const hand of Hands_State) {
    if (isThreeFingerToggleRotate(hand)) {
      if (now - lastRotateToggleTime > ROTATE_TOGGLE_COOLDOWN) {
        rotateEnabled = !rotateEnabled;
        lastRotateToggleTime = now;

        // reseta refs pra não dar pulo
        for (const b of Blocks) {
          b.last2Hand = null;
          b.lastAng = null;
          b.el.dataset.rot = String(b.rotAccumDeg || 0);
        }
      }
    }
  }

  // ======== DESENHO / BORRACHA =========
  let hudText = "IDLE";

  for (const hand of Hands_State) {
    const label = hand.label;
    const hp = HandPersistent[label] || { lastDraw: null, smTip: null };
    HandPersistent[label] = hp;

    hp.smTip = smoothPoint(hp.smTip, hand.tip, CFG.fingerSmooth);
    hand.tip = hp.smTip;

    if (isTwoFingerErase(hand)) {
      hudText = "ERASER";
      eraseAtPoint(hand.tip);
      hp.lastDraw = null;
    } else if (isOneFingerDraw(hand)) {
      hudText = "DRAW";
      drawLineSmooth(hand, hp);
    } else {
      hp.lastDraw = null;
    }
  }

  modeStateEl.textContent = `${hudText} | GIRO: ${rotateEnabled ? "ON" : "OFF"}`;

  updateBlocks();
});

/* ===================== CAMERA ===================== */
let isProcessing = false;

const camera = new Camera(video, {
  onFrame: async () => {
    if (isProcessing) return;
    isProcessing = true;
    try {
      const p = hands.send({ image: video });
      if (p instanceof Promise) {
        await Promise.race([
          p,
          new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), 1000))
        ]);
      }
    } catch (e) {
      console.error("Erro ao enviar frame:", e);
    } finally {
      isProcessing = false;
    }
  },
  width: 1280,
  height: 720
});

camera.start().catch(err => {
  console.error("Erro ao iniciar câmera:", err);
  alert("Erro ao acessar a câmera. Verifique permissões do navegador.");
});

/* ===================== CREATE BLOCKS ===================== */
createBlock("Bloco A", 140, 140, TEXTURES[0]);
createBlock("Bloco B", 380, 140, TEXTURES[1]);
createBlock("Bloco C", 620, 140, TEXTURES[2]);
</script>
